
apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-equipment-booking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: campus-equipment-booking
  template:
    metadata:
      labels:
        app: campus-equipment-booking
    spec:
      containers:
        - name: campus-equipment-booking
          image: campus-equipment-booking:set-e
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
